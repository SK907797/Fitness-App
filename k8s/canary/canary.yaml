apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fitness
      track: stable
  template:
    metadata:
      labels:
        app: fitness
        track: stable
    spec:
      containers:
      - name: fitness
        image: shantha087/fitness-app:v3.2.4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fitness
      track: canary
  template:
    metadata:
      labels:
        app: fitness
        track: canary
    spec:
      containers:
      - name: fitness
        image: shantha087/fitness-app:latest