apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness
      version: blue
  template:
    metadata:
      labels:
        app: fitness
        version: blue
    spec:
      containers:
      - name: aceest
        image: shantha087/fitness-app:v3.2.4
        ports:
        - containerPort: 5000