apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness
      version: green
  template:
    metadata:
      labels:
        app: fitness
        version: green
    spec:
      containers:
      - name: fitness
        image: shantha087/fitness-app:latest
        ports:
        - containerPort: 5000