apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness
      version: B
  template:
    metadata:
      labels:
        app: fitness
        version: B
    spec:
      containers:
      - name: fitness
        image: shantha087/fitness-app:latest
        ports:
        - containerPort: 5000